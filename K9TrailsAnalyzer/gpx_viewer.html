<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K9 Trails — GPX Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue:wght@700;800&display=swap');

  :root {
    --orange: #FFA814;
    --dark: #0f0f0f;
    --panel: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #666;
    --start: #4ade80;
    --end: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--orange);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--text); font-weight: 700; }

  .filename {
    font-size: 16px;
    color: var(--orange);
    padding: 3px 8px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .stats-bar {
    margin-left: auto;
    display: flex;
    gap: 24px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }

  .stat-value {
    font-size: 14px;
    font-weight: 500;
    color: var(--orange);
  }

  .stat-label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  #map {
    flex: 1;
    width: 100%;
  }

  .leaflet-container { background: #111; }

  .custom-popup .leaflet-popup-content-wrapper {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }

  .custom-popup .leaflet-popup-tip { background: var(--panel); }

  .popup-title {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .popup-info { color: var(--muted); font-size: 11px; }

  .footer-bar {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 6px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    font-size: 10px;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <div class="logo">K9 <span>Mantrailing</span> Analyzer</div>
  <div class="filename" id="filename">%%NAME_FILE%%</div>
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-value" id="stat-tracks">—</span>
      <span class="stat-label">Tracks</span>
    </div>
    
  </div>
</header>

<div id="map"></div>

<div class="footer-bar">
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--start)"></div>
    Start
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--end)"></div>
    End
  </div>
  <span id="track-legend"></span>
  <span style="margin-left:auto">K9 Mantrailing Analyzer · OpenStreetMap</span>
</div>

<script>
const GPX_DATA = `%%GPX_CONTENT%%`;

//const COLORS = ['#FFA814', '#60a5fa', '#4ade80', '#f87171', '#c084fc', '#fb923c', '#2dd4bf', '#e879f9'];
const COLORS = ['blue', 'red', 'green', 'orange', 'yellow', 'black', 'white', 'brown'];

// Použití:
console.log(COLORS.red); // #f87171
const map = L.map('map', { zoomControl: true });

//L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
//  attribution: '© OpenTopoMap © OpenStreetMap',
//  maxZoom: 17
//}).addTo(map);
L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://github.com/cyclosm/cyclosm-cartocss-style/releases">CyclOSM</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 17
}).addTo(map);

function haversine(a, b) {
  const R = 6371000;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 +
            Math.cos(a[0]*Math.PI/180) * Math.cos(b[0]*Math.PI/180) *
            Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function calcDist(latlngs) {
  let d = 0;
  for (let i = 1; i < latlngs.length; i++) d += haversine(latlngs[i-1], latlngs[i]);
  return d;
}

function formatDist(m) {
  return m >= 1000 ? (m/1000).toFixed(2) + ' km' : Math.round(m) + ' m';
}

function makeMarker(latlng, color, label) {
  const icon = L.divIcon({
    html: `<div style="width:11px;height:11px;background:${color};border:2px solid #0f0f0f;border-radius:50%;box-shadow:0 0 5px ${color}88"></div>`,
    className: '',
    iconAnchor: [5, 5]
  });
  return L.marker(latlng, { icon }).bindPopup(
    `<div class="popup-title" style="color:${color}">${label}</div>`,
    { className: 'custom-popup' }
  );
}

function render(gpxString) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(gpxString, 'application/xml');

  const tracks = doc.querySelectorAll('trk');
  const wpts   = doc.querySelectorAll('wpt');

  const allLatLngs = [];
  let totalDist   = 0;
  let totalPoints = 0;
  const legendItems = [];

  tracks.forEach((trk, idx) => {
    const color  = COLORS[idx % COLORS.length];
    const name   = trk.querySelector('name')?.textContent?.trim() || `Trasa ${idx + 1}`;
    const trkpts = trk.querySelectorAll('trkpt');

    const latlngs = [];
    trkpts.forEach(pt => {
      latlngs.push([
        parseFloat(pt.getAttribute('lat')),
        parseFloat(pt.getAttribute('lon'))
      ]);
    });

    if (!latlngs.length) return;

    const dist = calcDist(latlngs);

    // Polyline
    L.polyline(latlngs, {
      color: color,
      weight: 3.5,
      opacity: 0.95,
      lineJoin: 'round',
      lineCap: 'round'
    }).bindPopup(
      `<div class="popup-title" style="color:${color}">${name}</div>
       <div class="popup-info">${latlngs.length} bodů · ${formatDist(dist)}</div>`,
      { className: 'custom-popup' }
    ).addTo(map);

    // Start a cíl
    makeMarker(latlngs[0], '#4ade80', `▶ Start — ${name}`).addTo(map);
    makeMarker(latlngs[latlngs.length - 1], '#f87171', `■ Cíl — ${name}`).addTo(map);

    totalDist   += dist;
    totalPoints += latlngs.length;
    allLatLngs.push(...latlngs);

    legendItems.push(
      `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px">
        <span style="display:inline-block;width:16px;height:3px;background:${color};border-radius:2px;flex-shrink:0"></span>
        ${name}
      </span>`
    );
  });

  // Waypointy
  wpts.forEach(wpt => {
    const wName = wpt.querySelector('name')?.textContent?.trim() || '';
    const wIcon = L.divIcon({
      html: `<div style="width:12px;height:12px;background:#555;border:2px solid #000;border-radius:50%"></div>`,
      className: '',
      iconAnchor: [3, 3]
    });
    L.marker([parseFloat(wpt.getAttribute('lat')), parseFloat(wpt.getAttribute('lon'))], { icon: wIcon })
      .bindPopup(`<div class="popup-title">◆ ${wName}</div>`, { className: 'custom-popup' })
      .addTo(map);
  });

  // Fit mapy na všechny trasy
  if (allLatLngs.length) {
    map.fitBounds(L.latLngBounds(allLatLngs), { padding: [40, 40] });
  }

  // Statistiky
  document.getElementById('stat-tracks').textContent = tracks.length;
  document.getElementById('stat-dist').textContent   = formatDist(totalDist);
  document.getElementById('stat-points').textContent = totalPoints;
  document.getElementById('track-legend').innerHTML  = legendItems.join('');

  // Název z GPX
  const gpxName = doc.querySelector('metadata > name')?.textContent?.trim()
               || doc.querySelector('trk > name')?.textContent?.trim();
  if (gpxName) document.getElementById('filename').textContent = gpxName;
}

render(GPX_DATA);
</script>
</body>
</html>
