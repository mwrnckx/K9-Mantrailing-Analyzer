<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K9 Trails — GPX Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --orange: #FFA814;
    --dark: #0f0f0f;
    --panel: #1c1c1c;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #b2b2b2;
    --start: #4ade80;
    --end: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    z-index: 1000;
  }

  /* --- NOVÉ ROZVRŽENÍ --- */
  .main-content {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  #description-panel {
    width: 350px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.6;
  }

  #map {
    flex: 1;
    height: 100%;
  }

  /* Styl pro vkládaný text z TrailReport */
  .report-item { margin-bottom: 16px; }
  .report-value { color: var(--text); }
  .report-title { 
    font-family: 'Bebas Neue', sans-serif; 
    font-size: 24px; 
    color: var(--orange); 
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }

  /* --- PŮVODNÍ STYLY --- */
  .logo { font-family: 'Bebas Neue', sans-serif; font-weight: 800; font-size: 18px; color: var(--orange); }
  .logo span { color: var(--text); }
  .filename { font-size: 14px; color: var(--orange); padding: 3px 8px; background: var(--dark); border: 1px solid var(--border); }
  .stats-bar { margin-left: auto; display: flex; gap: 24px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat-value { font-size: 14px; color: var(--orange); }
  .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; }
  .footer-bar { background: var(--panel); border-top: 1px solid var(--border); padding: 6px 20px; display: flex; gap: 16px; font-size: 10px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .custom-popup .leaflet-popup-content-wrapper { background: var(--panel); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono'; }
</style>
</head>
<body>

<header>
  <div class="logo">K9 <span>Mantrailing</span> Analyzer</div>
  <div class="filename" id="filename">%%NAME_FILE%%</div>
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-value" id="stat-tracks">—</span>
      <span class="stat-label">Tracks</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-dist">—</span>
      <span class="stat-label">Distance</span>
    </div>
  </div>
</header>

<div class="main-content">
  <aside id="description-panel">
    %%DESCRIPTION%%
  </aside>
  <div id="map"></div>
</div>

<div class="footer-bar">
  <div class="legend-item"><div class="legend-dot" style="background:var(--start)"></div> Start</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--end)"></div> End</div>
  <span id="track-legend"></span>
  <span style="margin-left:auto">K9 Mantrailing Analyzer</span>
</div>

<script>
const GPX_DATA = `%%GPX_CONTENT%%`;
const COLORS = ['blue', 'red', 'green', 'orange', 'yellow', 'black', 'white', 'brown'];

const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 17
}).addTo(map);

// ... (zbytek vaší původní JS logiky pro renderování GPX zůstává stejný) ...
function haversine(a, b) {
  const R = 6371000;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180) * Math.cos(b[0]*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function calcDist(latlngs) {
  let d = 0;
  for (let i = 1; i < latlngs.length; i++) d += haversine(latlngs[i-1], latlngs[i]);
  return d;
}
function formatDist(m) {
  return m >= 1000 ? (m/2000).toFixed(2) + ' km' : Math.round(m/2) + ' m';
}
function makeMarker(latlng, color, label) {
  const icon = L.divIcon({
    html: `<div style="width:11px;height:11px;background:${color};border:2px solid #0f0f0f;border-radius:50%"></div>`,
    className: '',
    iconAnchor: [5, 5]
  });
  return L.marker(latlng, { icon }).bindPopup(`<div class="popup-title">${label}</div>`, { className: 'custom-popup' });
}

function render(gpxString) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(gpxString, 'application/xml');
  const tracks = doc.querySelectorAll('trk');
  const allLatLngs = [];
  let totalDist = 0;

  tracks.forEach((trk, idx) => {
    const color = COLORS[idx % COLORS.length];
    const trkpts = trk.querySelectorAll('trkpt');
    const latlngs = Array.from(trkpts).map(pt => [parseFloat(pt.getAttribute('lat')), parseFloat(pt.getAttribute('lon'))]);
    if (!latlngs.length) return;

    L.polyline(latlngs, { color: color, weight: 3.5 }).addTo(map);
    makeMarker(latlngs[0], '#4ade80', 'Start').addTo(map);
    makeMarker(latlngs[latlngs.length-1], '#f87171', 'Cíl').addTo(map);
    
    totalDist += calcDist(latlngs);
    allLatLngs.push(...latlngs);
  });

  if (allLatLngs.length) map.fitBounds(L.latLngBounds(allLatLngs), { padding: [40, 40] });
  document.getElementById('stat-tracks').textContent = tracks.length;
  document.getElementById('stat-dist').textContent = formatDist(totalDist);
}

render(GPX_DATA);
</script>
</body>
</html>
